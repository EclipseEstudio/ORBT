name: APK Android para revisão

on:
  pull_request:
    branches: [alpha]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: android-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Baixar Godot e modelos oficiais
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/godotengine/godot/releases/download/4.7.2-stable'
          $arquivos = @(
            @{ Nome = 'Godot_v4.7.2-stable_win64.exe.zip'; Hash = '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953' },
            @{ Nome = 'Godot_v4.7.2-stable_export_templates.tpz'; Hash = 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011' }
          )
          foreach ($arquivo in $arquivos) {
            $destino = Join-Path $env:RUNNER_TEMP $arquivo.Nome
            Invoke-WebRequest "$base/$($arquivo.Nome)" -OutFile $destino
            if ((Get-FileHash -LiteralPath $destino -Algorithm SHA256).Hash -ne $arquivo.Hash) { throw "Checksum inválido: $($arquivo.Nome)" }
          }
          Expand-Archive (Join-Path $env:RUNNER_TEMP $arquivos[0].Nome) (Join-Path $env:RUNNER_TEMP 'godot')
          $zipModelos = Join-Path $env:RUNNER_TEMP 'modelos.zip'
          Copy-Item (Join-Path $env:RUNNER_TEMP $arquivos[1].Nome) $zipModelos
          Expand-Archive $zipModelos (Join-Path $env:RUNNER_TEMP 'modelos')
          $dados = Join-Path $env:APPDATA 'Godot'
          $modelos = Join-Path $dados 'export_templates/4.7.2.stable'
          New-Item -ItemType Directory -Force -Path $modelos | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'modelos/templates/*') $modelos -Recurse
          "ORBT_GODOT=$(Join-Path $env:RUNNER_TEMP 'godot/Godot_v4.7.2-stable_win64_console.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Preparar exportação Android
        env:
          ORBT_ANDROID_KEYSTORE_BASE64: ${{ secrets.ORBT_ANDROID_KEYSTORE_BASE64 }}
          ORBT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ORBT_ANDROID_KEYSTORE_PASSWORD }}
          ORBT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ORBT_ANDROID_KEYSTORE_ALIAS }}
          ORBT_PREVIA_EXTERNA: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          $previa = $env:ORBT_PREVIA_EXTERNA -eq 'true'
          ./scripts/configurar-android-ci.ps1 -Java $env:JAVA_HOME -Sdk $env:ANDROID_HOME -DadosGodot (Join-Path $env:APPDATA 'Godot') -DiretorioTemporario $env:RUNNER_TEMP -ChaveTemporaria:$previa -PacotePrevia 'com.eclipseestudio.orbt.previa.p${{ github.event.pull_request.number }}'
      - name: Importar projeto
        run: |
          $orbtSaida = & $env:ORBT_GODOT --headless --editor --path . --import 2>&1
          $orbtCodigo = $LASTEXITCODE
          $orbtSaida | Write-Output
          if ($orbtCodigo -ne 0 -or ($orbtSaida -match 'SCRIPT ERROR:|ERROR:')) {
            throw 'Falha ao importar o projeto.'
          }
      - name: Executar testes
        run: ./tests/run.ps1 -Godot $env:ORBT_GODOT
      - name: Verificar pacote exportado
        run: ./tests/run_exportacao.ps1 -Godot $env:ORBT_GODOT
      - name: Gerar e verificar APK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $previa = '${{ github.event.pull_request.head.repo.full_name != github.repository }}' -eq 'true'
          ./scripts/exportar-android.ps1 -Godot $env:ORBT_GODOT -Ferramentas (Join-Path $env:ANDROID_HOME 'build-tools/36.1.0') -Previa:$previa
          & (Join-Path $env:ANDROID_HOME 'build-tools/36.1.0/apksigner.bat') verify --verbose build/android/ORBT-debug.apk
          if ($LASTEXITCODE -ne 0) { throw 'Assinatura do APK inválida.' }
          & (Join-Path $env:ANDROID_HOME 'build-tools/36.1.0/zipalign.exe') -c -P 16 4 build/android/ORBT-debug.apk
          if ($LASTEXITCODE -ne 0) { throw 'Alinhamento do APK inválido.' }
          ./scripts/verificar-atualizacao-android.ps1 -Apk build/android/ORBT-debug.apk -Ferramentas (Join-Path $env:ANDROID_HOME 'build-tools/36.1.0') -Previa:$previa -CompararPublicada:(-not $previa) -Saida build/android/atualizacao.json
          @(
            "PR: #${{ github.event.pull_request.number }}",
            "Cabeça: ${{ github.event.pull_request.head.sha }}",
            "Base: ${{ github.event.pull_request.base.sha }}",
            "Revisão testada (merge): $env:GITHUB_SHA",
            "Godot: 4.7.2.stable",
            "SHA-256 do APK: $((Get-FileHash build/android/ORBT-debug.apk -Algorithm SHA256).Hash)"
          ) | Set-Content -Encoding utf8 build/android/revisao.txt
      - name: Disponibilizar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: ORBT-android-debug-pr-${{ github.event.pull_request.number }}
          path: |
            build/android/ORBT-debug.apk
            build/android/revisao.txt
            build/android/atualizacao.json
          if-no-files-found: error
          retention-days: 14

  publicar-0-5-0:
    name: Publicar ORBT 0.5.0 alpha
    needs: android
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/0.5.0'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ORBT-android-debug-pr-${{ github.event.pull_request.number }}
          path: build/publicacao
      - name: Publicar o APK validado
        env:
          GH_TOKEN: ${{ github.token }}
          ORBT_HEAD: ${{ github.event.pull_request.head.sha }}
          ORBT_PR: ${{ github.event.pull_request.number }}
          ORBT_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v0.5.0-alpha.20261107'
          $testada = git rev-parse 'HEAD^{tree}'
          $origem = git rev-parse ($env:ORBT_HEAD + '^{tree}')
          if ($LASTEXITCODE -ne 0 -or $testada -ne $origem) { throw 'A árvore testada difere da revisão a publicar; atualize a branch de release.' }
          $atual = gh api "repos/$env:ORBT_REPO/pulls/$env:ORBT_PR" --jq '.head.sha'
          if ($LASTEXITCODE -ne 0 -or $atual -ne $env:ORBT_HEAD) { throw 'O PR mudou durante a validação.' }
          . ./scripts/android-pacote.ps1
          $configuracao = Ler-ConfiguracaoAndroidProjeto
          $pacote = Get-Content build/publicacao/atualizacao.json -Raw | ConvertFrom-Json
          if ($configuracao.versao -ne '0.5.0' -or $configuracao.codigo -ne 9) { throw 'Versão de publicação inesperada.' }
          if ($pacote.versao -ne '0.5.0' -or $pacote.codigo -ne 9 -or $pacote.canal -ne 'distribuicao') { throw 'Metadados do APK incompatíveis.' }
          $hash = (Get-FileHash build/publicacao/ORBT-debug.apk -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $pacote.apk_sha256) { throw 'O APK difere do arquivo verificado.' }
          if (-not (Select-String -Path build/publicacao/revisao.txt -SimpleMatch "Cabeça: $env:ORBT_HEAD" -Quiet)) { throw 'Artefato de outra revisão.' }
          $releases = gh api "repos/$env:ORBT_REPO/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível consultar releases.' }
          if ($releases | Where-Object tag_name -eq $tag) {
            $publicada = gh api "repos/$env:ORBT_REPO/commits/$tag" --jq '.sha'
            if ($LASTEXITCODE -ne 0 -or $publicada -ne $env:ORBT_HEAD) { throw 'A tag existente aponta para outra revisão.' }
            Write-Output "Release já publicada: $tag"
            exit 0
          }
          Get-ChildItem build/publicacao -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -Encoding utf8 build/publicacao/SHA256SUMS.txt
          $notas = Get-Content docs/auxiliar/versao-0.5.0-alpha-2026-11-07.md -Raw
          $notas += "`n`n[PR #$env:ORBT_PR](https://github.com/$env:ORBT_REPO/pull/$env:ORBT_PR) · Revisão: $env:ORBT_HEAD`n"
          $notas | Set-Content -Encoding utf8 build/publicacao/notas.md
          gh release create $tag build/publicacao/ORBT-debug.apk build/publicacao/atualizacao.json build/publicacao/revisao.txt build/publicacao/SHA256SUMS.txt --repo $env:ORBT_REPO --target $env:ORBT_HEAD --title 'ORBT 0.5.0 alpha' --notes-file build/publicacao/notas.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar a release.' }
