name: Página de download no GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main, alpha]
    paths: ['.github/workflows/web-pages.yml', 'docs/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publicar página de download
        id: deployment
        uses: actions/deploy-pages@v4
